<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .modal-backdrop.show {
            z-index: 2050 !important;
        }
        .modal.show {
            z-index: 2100 !important;
        }
    </style>
</head>
<body>
<a href="{{ url_for('register_admin') }}" class="btn btn-link">Register New Admin</a>
<div class="container mt-5">
    <h2>Admin Login</h2>
    <div id="adminMessage" class="text-center" style="color: green; font-size: 20px; margin-top: 20px;">
        {% if mess %}
            {{ mess }}
        {% endif %}
    </div>
    <form method="POST" id="adminLoginForm">
        <div class="mb-3">
            <label for="admin_number" class="form-label">Admin Number</label>
            <input type="text" class="form-control" id="admin_number" name="admin_number" required>
        </div>
        <button type="button" class="btn btn-primary" id="openWebcamBtn">Authenticate with Face</button>
    </form>
    <a href="{{ url_for('home') }}" class="btn btn-secondary mt-3">Back</a>
</div>

<!-- Webcam Modal -->
<div class="modal fade" id="webcamModal" tabindex="-1" aria-labelledby="webcamModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="webcamModalLabel">Face Authentication</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeModalBtn"></button>
      </div>
      <div class="modal-body text-center">
        <video id="adminWebcam" width="320" height="240" autoplay playsinline style="border:2px solid #333;"></video>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
<script>


let adminStream = null;
const webcamModal = new bootstrap.Modal(document.getElementById('webcamModal'));

function startAdminWebcam() {
    const video = document.getElementById('adminWebcam');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(s) {
                adminStream = s;
                video.srcObject = adminStream;
                video.play();
                // Wait for video to be ready, then capture and send frame
                video.onloadedmetadata = () => {
                    setTimeout(captureAndSendAdminFrame, 1000); // Wait 1s for camera to adjust
                };
            })
            .catch(function(err) {
                showAdminMessage("Error accessing webcam: " + err, "red");
            });
    } else {
        showAdminMessage("getUserMedia not supported in this browser.", "red");
    }
}

function stopAdminWebcam() {
    if (adminStream) {
        adminStream.getTracks().forEach(track => track.stop());
        adminStream = null;
    }
    document.getElementById('adminWebcam').srcObject = null;
}

function showAdminMessage(message, color) {
    const msgDiv = document.getElementById('adminMessage');
    msgDiv.style.color = color;
    msgDiv.textContent = message;
}

// Capture frame and send to backend
function captureAndSendAdminFrame() {
    const video = document.getElementById('adminWebcam');
    const adminNumber = document.getElementById('admin_number').value;
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = canvas.toDataURL('image/jpeg');
    // Send imageData and admin number to backend via AJAX
    fetch('/scan_admin_login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: imageData, admin_number: adminNumber })
    })
    .then(response => response.json())
    .then(data => {
        stopAdminWebcam();
        webcamModal.hide();
        if (data.success) {
            showAdminMessage('Admin authenticated: ' + data.name, 'green');
            if (data.redirect_url) {
                window.location.href = data.redirect_url;
            }
        } else {
            showAdminMessage('Authentication failed. Try again.', 'red');
        }
    })
    .catch(() => {
        stopAdminWebcam();
        webcamModal.hide();
        showAdminMessage('Error scanning face.', 'red');
    });
}

// Open modal and start webcam when Authenticate with Face is clicked
document.getElementById('openWebcamBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const form = document.getElementById('adminLoginForm');
    if (form.checkValidity()) {
        webcamModal.show();
        startAdminWebcam();
    } else {
        form.reportValidity(); // Show browser validation prompt
    }
});

// Stop webcam when modal is closed
document.getElementById('closeModalBtn').addEventListener('click', function() {
    stopAdminWebcam();
    webcamModal.hide();
});

// Also stop webcam if modal is closed by clicking outside or pressing ESC
document.getElementById('webcamModal').addEventListener('hidden.bs.modal', function () {
    stopAdminWebcam();
});

</script>
</body>
</html>
