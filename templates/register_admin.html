<!doctype html>
<html lang="en">
<head>
    <style>
        .modal-backdrop.show {
            z-index: 2050 !important;
        }
        .modal.show {
            z-index: 2100 !important;
        }
    </style>
    <meta charset="utf-8">
    <title>Register Admin</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Register Admin</h2>
        <div id="adminRegisterMessage" class="text-center" style="color: green; font-size: 20px; margin-top: 20px;">
            {% if mess %}
                {{ mess }}
            {% endif %}
        </div>
<form id="registerAdminForm">
    <div class="mb-3">
        <label for="admin_name" class="form-label">Admin Name</label>
        <input type="text" class="form-control" id="admin_name" name="admin_name" required>
    </div>
    <div class="mb-3">
        <label for="admin_number" class="form-label">Admin Number</label>
        <input type="text" class="form-control" id="admin_number" name="admin_number" required>
        <div style="font-size: 16px; color: #0b4c61; margin-top: 5px;">
            <b>Admin Number is required to authenticate face.</b>
        </div>
    </div>
    <button type="button" class="btn btn-primary" id="openRegisterWebcamBtn">Register with Face</button>
</form>

    <!-- Webcam Modal -->
    <div class="modal fade" id="registerWebcamModal" tabindex="-1" aria-labelledby="registerWebcamModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="registerWebcamModalLabel">Register Admin Webcam</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="closeRegisterModalBtn"></button>
          </div>
          <div class="modal-body text-center">
            <video id="registerAdminWebcam" width="320" height="240" autoplay playsinline style="border:2px solid #333;"></video>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        
let registerAdminStream = null;
const registerWebcamModal = new bootstrap.Modal(document.getElementById('registerWebcamModal'));
let adminFaceImages = [];
const REQUIRED_IMAGES = 10;
let adminCaptureInterval = null;

function startRegisterAdminWebcam() {
    adminFaceImages = [];
    const video = document.getElementById('registerAdminWebcam');
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(s) {
                registerAdminStream = s;
                video.srcObject = registerAdminStream;
                video.play();
                video.onloadedmetadata = () => {
                    // Start automatic capture
                    adminCaptureInterval = setInterval(() => {
                        if (adminFaceImages.length < REQUIRED_IMAGES) {
                            const canvas = document.createElement('canvas');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            const imageData = canvas.toDataURL('image/jpeg');
                            adminFaceImages.push(imageData);
                        }
                        if (adminFaceImages.length === REQUIRED_IMAGES) {
                            clearInterval(adminCaptureInterval);
                            submitAdminFaces();
                        }
                    }, 400); // Capture every 400ms
                };
            })
            .catch(function(err) {
                showRegisterAdminMessage("Error accessing webcam: " + err, "red");
            });
    } else {
        showRegisterAdminMessage("getUserMedia not supported in this browser.", "red");
    }
}

function stopRegisterAdminWebcam() {
    if (adminCaptureInterval) {
        clearInterval(adminCaptureInterval);
        adminCaptureInterval = null;
    }
    if (registerAdminStream) {
        registerAdminStream.getTracks().forEach(track => track.stop());
        registerAdminStream = null;
    }
    document.getElementById('registerAdminWebcam').srcObject = null;
}

function showRegisterAdminMessage(message, color) {
    const msgDiv = document.getElementById('adminRegisterMessage');
    msgDiv.style.color = color;
    msgDiv.textContent = message;
}

function submitAdminFaces() {
    const adminName = document.getElementById('admin_name').value;
    const adminNumber = document.getElementById('admin_number').value;
    fetch('/register_admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ images: adminFaceImages, admin_name: adminName, admin_number: adminNumber })
    })
    .then(response => response.json())
    .then(data => {
        stopRegisterAdminWebcam();
        registerWebcamModal.hide();
        if (data.success) {
            showRegisterAdminMessage('Admin registered successfully!', 'green');
            setTimeout(() => window.location.href = "{{ url_for('admin_login') }}", 1200);
        } else {
            showRegisterAdminMessage('Error: ' + (data.error || 'Registration failed.'), 'red');
        }
    })
    .catch(() => {
        stopRegisterAdminWebcam();
        registerWebcamModal.hide();
        showRegisterAdminMessage('Error registering admin.', 'red');
    });
}

document.getElementById('openRegisterWebcamBtn').addEventListener('click', function(e) {
    e.preventDefault();
    const form = document.getElementById('registerAdminForm');
    if (form.checkValidity()) {
        registerWebcamModal.show();
        startRegisterAdminWebcam();
    } else {
        form.reportValidity();
    }
});

document.getElementById('closeRegisterModalBtn').addEventListener('click', function() {
    stopRegisterAdminWebcam();
    registerWebcamModal.hide();
});

document.getElementById('registerWebcamModal').addEventListener('hidden.bs.modal', function () {
    stopRegisterAdminWebcam();
});
    </script>
</body>
</html>
